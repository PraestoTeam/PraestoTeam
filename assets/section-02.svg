<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="106" viewBox="0 0 1000 106" role="img" aria-labelledby="t d"><title id="t">02 · Servicios</title><desc id="d">Se contratan por separado o juntos</desc><style>
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.045);opacity:.45}}
