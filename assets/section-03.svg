<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="106" viewBox="0 0 1000 106" role="img" aria-labelledby="t d"><title id="t">03 · Logística inteligente</title><desc id="d">Cada servicio se planifica, se registra y se controla</desc><style>
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.045);opacity:.45}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.flow{stroke-dasharray:6 10;animation:dash 1.8s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.twinkle{animation:twinkle 4s ease-in-out infinite}
.sweep{animation:sweep 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
